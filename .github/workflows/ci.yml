name: CI

on:
  push:
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # GitHub-hosted Ubuntu runners ship an Android SDK (ANDROID_HOME is set).
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Engine unit tests
        run: ./gradlew test -Pgenesis.requireAndroid=true --stacktrace

      - name: Assemble APKs (app, instrumentation tests, fixture app)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :fixtures:chat:assembleDebug -Pgenesis.requireAndroid=true

      - name: Android lint
        run: ./gradlew :app:lintDebug -Pgenesis.requireAndroid=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: genesis-prototype-apk
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    # Runs the real engine and accessibility service on an Android emulator against the
    # fixture chat app and the Settings app.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :fixtures:chat:assembleDebug -Pgenesis.requireAndroid=true

      - name: Run on-device engine tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/run-emulator-tests.sh

      - name: Upload on-device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            e2e-logcat.txt
          if-no-files-found: ignore

  publish-prototype:
    # After the emulator tests pass, publish the prototype APK as a pre-release so it can be
    # downloaded directly on a phone. Debug-signed; for testing only.
    runs-on: ubuntu-latest
    needs: [build, emulator]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: genesis-prototype-apk
          path: apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk genesis-prototype.apk
          sha=$(sha256sum genesis-prototype.apk | cut -d' ' -f1)
          gh release delete prototype --yes --cleanup-tag || true
          gh release create prototype genesis-prototype.apk --prerelease --target "$GITHUB_SHA" \
            --title "GENESIS prototype (testing only)" \
            --notes "Phase 2 prototype for on-device testing. Debug-signed, not for distribution. Commit $GITHUB_SHA. SHA-256: $sha"
